name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  minimum-dependencies:
    name: Declared minimum dependencies / Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install declared minimum dependency set
        run: |
          python -m pip install 'setuptools==83.0.0'
          python -m pip install \
            'Pillow==12.3.0' \
            'pydantic==2.9.0' \
            'yt-dlp==2026.6.9' \
            'fastapi==0.139.0' \
            'starlette==1.3.1' \
            'uvicorn==0.51.0' \
            'python-multipart==0.0.31'
          python -m pip install --no-deps -e .

      - name: Verify minimum dependency set
        run: |
          python -m pip check
          python -m compileall -q src
          PYTHONPATH=src python -m unittest discover -v

      - name: Audit minimum dependency set
        run: |
          python -m pip install 'pip-audit==2.10.1'
          pip-audit --local --skip-editable --progress-spinner off

  python:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install media tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install media tools (macOS)
        if: runner.os == 'macOS'
        run: command -v ffmpeg >/dev/null 2>&1 || brew install ffmpeg

      - name: Install package
        run: |
          python -m pip install 'setuptools>=83.0.0'
          python -m pip install -e '.[api]'

      - name: Compile Python
        run: python -m compileall -q src

      - name: Run unit tests
        run: PYTHONPATH=src python -m unittest discover -v

      - name: Inspect runtime
        run: PYTHONPATH=src python -m video_analysis_mvp.cli doctor

      - name: Run package smoke
        run: sh scripts/smoke-test.sh

      - name: Run persistent demo contract smoke
        run: sh scripts/demo-smoke-test.sh

      - name: Run API smoke
        run: sh scripts/api-smoke-test.sh

      - name: Run primary review and finalization smoke
        run: sh scripts/review-workflow-smoke-test.sh

      - name: Run six-case synthetic product benchmark
        if: runner.os == 'Linux' && matrix.python-version == '3.11'
        run: PYTHONPATH=src python -m video_analysis_mvp.cli benchmark --output "$RUNNER_TEMP/vew-benchmark"

      - name: Prove frontend drift gate rejects mutations
        run: sh scripts/test-frontend-assets-gate.sh

      - name: Verify fresh frontend build matches source mirror and wheel
        run: sh scripts/install-smoke-test.sh

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test Vite proxy origin isolation
        run: npm run test:integration

      - name: Build
        run: npm run build

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

  export-render:
    name: Real XLSX / PDF / browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install explicit render runtimes
        run: |
          python -m pip install 'setuptools>=83.0.0'
          python -m pip install -e '.[export,pdf]'
          npm ci --prefix frontend --ignore-scripts
          (cd frontend && npx playwright install --with-deps chromium)
          sudo apt-get update
          sudo apt-get install -y libreoffice-calc fonts-noto-cjk

      - name: Bind preinstalled browser and font
        run: |
          echo "VEW_PDF_NODE=$(command -v node)" >> "$GITHUB_ENV"
          echo "VEW_PDF_NODE_MODULES=$GITHUB_WORKSPACE/frontend/node_modules" >> "$GITHUB_ENV"
          echo "VEW_PDF_BROWSER=$(node -e \"const { chromium } = require('./frontend/node_modules/playwright'); process.stdout.write(chromium.executablePath())\")" >> "$GITHUB_ENV"
          echo "VEW_PDF_FONT=$(fc-match -f '%{file}' 'Noto Sans CJK SC' | head -n 1)" >> "$GITHUB_ENV"
          echo "VEW_PDF_FONT_NAME=Noto Sans CJK SC" >> "$GITHUB_ENV"
          echo "VEW_REQUIRE_PDF_RUNTIME=1" >> "$GITHUB_ENV"
          echo "VEW_REQUIRE_OFFICE_RUNTIME=1" >> "$GITHUB_ENV"

      - name: Build and run browser E2E
        run: |
          set -o pipefail
          mkdir -p test-results
          npm --prefix frontend run build 2>&1 | tee test-results/frontend-build.log
          npm --prefix frontend run test:e2e 2>&1 | tee test-results/browser-e2e.log

      - name: Run real render and cross-format tests
        run: |
          set -o pipefail
          PYTHONPATH=src python -m unittest -v \
            tests.test_export_templates \
            tests.test_export_xlsx \
            tests.test_export_pdf \
            tests.test_export_service \
            tests.test_cli_exports \
            tests.test_export_visual_runtime \
            2>&1 | tee test-results/export-render.log

      - name: Audit generated-artifact cleanup
        if: always()
        run: sh scripts/audit-test-artifacts.sh

      - name: Upload bounded failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: export-render-failure
          path: test-results
          if-no-files-found: ignore
          retention-days: 3

  security:
    name: Python dependency and source security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and audit tools
        run: |
          python -m pip install 'setuptools>=83.0.0'
          python -m pip install -e '.[api]' 'pip-audit==2.10.1' 'bandit==1.9.4' 'ruff==0.15.22'

      - name: Audit installed dependencies
        run: pip-audit --local --skip-editable --progress-spinner off

      - name: Scan Python source
        run: bandit -q -r src -ll

      - name: Lint Python source and tests
        run: ruff check src tests
